# Release gate for main.
#
# Verification runs once, on dev (see ci.yml): every commit merged into main is
# a dev commit that already carries a green run, so main re-runs no checks.
# What is left here are invariants that only hold on the release branch — the
# template-drift gate compares registry items against fewbie-starter's default
# branch, which is the source `fewbie create` clones.
name: Release check

on:
  push:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @devbie/cli-kit
      - run: npm run check:template-drift -w @devbie/fewbie-cli
