# Dependabot PR triage: auto-merge minor/patch updates, close stray major
# bumps defensively.
#
# Runs daily at 06:30 Asia/Shanghai (22:30 UTC), one hour after Dependabot
# opens its updates at 05:30 Asia/Shanghai. Lives on the default branch (main)
# because GitHub only schedules workflows from there; the same file is kept on
# dev so the two branches do not drift.
#
# Policy (mirrors .github/dependabot.yml): major upgrades are
# milestone-driven and never merged automatically — Dependabot is already
# configured to ignore them, so one appearing means config drift, and it is
# closed with an explanatory comment. Everything else (patch/minor,
# including grouped lockstep updates) is squash-merged without waiting for
# checks: CI runs once on the dev -> main PR, so a bad update is caught at
# that boundary and blocks the promotion; dev is never deployed or published.
name: Dependabot triage

on:
  schedule:
    # 22:30 UTC = 06:30 Asia/Shanghai (UTC+8, no DST).
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage open Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          merged=0
          closed=0
          skipped=0
          detail=$(mktemp)

          prs=$(gh pr list --repo "$REPO" --author "app/dependabot" --state open --json number,title --limit 50)

          while IFS=$'\t' read -r number title; do
            if [ -z "$number" ]; then continue; fi
            action="skipped"
            reason=""

            # Defensive close: a major bump must never merge. Dependabot
            # ignores majors (dependabot.yml), so a stray one means config
            # drift. Group PRs carry no "from X to Y" versions in the title
            # and only ever aggregate patch/minor, so they skip this check.
            old_version=$(sed -n 's/^Bump .* from \([^ ]*\) to .*$/\1/p' <<<"$title")
            new_version=$(sed -n 's/^Bump .* from .* to \([^ ]*\) *$/\1/p' <<<"$title")
            if [ -n "$old_version" ] && [ -n "$new_version" ] && [ "${old_version%%.*}" != "${new_version%%.*}" ]; then
              gh pr close "$number" --repo "$REPO" --comment "Closing automatically: major upgrades are milestone-driven per repo policy (see .github/dependabot.yml). A green CI run is not accepted as evidence for a major upgrade. Reopen and handle manually if this was intentional."
              action="closed"
            elif gh pr merge "$number" --repo "$REPO" --squash; then
              action="merged"
            else
              reason="merge failed (conflicts or squash merge disabled)"
            fi

            case "$action" in
              merged) merged=$((merged + 1)) ;;
              closed) closed=$((closed + 1)) ;;
              *) skipped=$((skipped + 1)) ;;
            esac
            printf '%s #%s %s%s\n' "$action" "$number" "$title" "${reason:+ -- $reason}" >>"$detail"
          done < <(jq -r '(. // [])[] | [(.number | tostring), .title] | @tsv' <<<"$prs")

          {
            echo "## Dependabot triage"
            echo ""
            echo "merged: $merged / closed: $closed / skipped: $skipped"
            echo ""
            if [ -s "$detail" ]; then cat "$detail"; else echo "no open Dependabot PRs"; fi
          } >>"$GITHUB_STEP_SUMMARY"
