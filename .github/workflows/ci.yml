name: CI

# Verification runs once, on the integration branch. main only receives dev
# commits that already carry a green run here, so it re-runs nothing; its own
# release-only gates live in release-check.yml.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

      # Build zero-dependency shared packages and leaf SDKs first:
      # @devbie/newbie and the CLI workspaces resolve them through workspace
      # symlinks, so their dist/ must exist beforehand.
      - run: npm run build -w @devbie/cli-kit
      - run: npm run build -w @devbie/modules-state
      - run: npm run build -w @devbie/heartbeat-sdk
      - run: npm run build -w @devbie/health-sdk
      - run: npm run build -w @devbie/backend-monitor-sdk
      - run: npm run build -w @devbie/web-monitor-sdk

      - run: npm run build -w @devbie/newbie

      - run: npm run build -w @devbie/newbie-cli
      - run: npm run build -w @devbie/aws-secrets-cli

      - run: npm run build -w @devbie/fewbie-cli

      - run: npm run build -w @devbie/apits

      # Behavioral tests run in the same job: the builds above already produce
      # every dist/ the suites import, so a second job would repeat `npm ci`
      # and seven builds for nothing. Each test is its own step, so a failure
      # stays attributable and still tells you whether the build was green.
      #
      # One step per workspace that owns a behavioral suite. Listed explicitly
      # rather than --workspaces so a package gains/loses coverage only by
      # intent: apits' "test" runs a scratch script, not a suite.
      - run: npm test -w @devbie/newbie-cli
      - run: npm test -w @devbie/newbie
      - run: npm test -w @devbie/fewbie-cli
      - run: npm test -w @devbie/health-sdk
      - run: npm test -w @devbie/heartbeat-sdk
      - run: npm test -w @devbie/worklog
      - run: npm test -w @devbie/backend-monitor-sdk
      - run: npm test -w @devbie/cli-kit
      - run: npm test -w @devbie/aws-secrets-cli
      - run: npm test -w @devbie/modules-state
      - run: npm test -w @devbie/module-hub-cli
